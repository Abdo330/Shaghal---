    function settingsMarkup(){const option=(group,key,label,checked)=>`<button class="setting-option" type="button" data-setting="${group}" data-value="${key}" aria-pressed="${checked}"><span>${label}</span>${checked?'<span class="check" aria-hidden="true">✓</span>':''}</button>`;return `<section class="settings"><div class="setting-group"><div class="setting-heading">${t('language')}</div>${option('lang','ar',t('arabic'),state.lang==='ar')}${option('lang','en',t('english'),state.lang==='en')}</div><div class="setting-group"><div class="setting-heading">${t('appearance')}</div>${option('theme','dark',t('dark'),state.theme==='dark')}${option('theme','light',t('light'),state.theme==='light')}${option('theme','system',t('system'),state.theme==='system')}</div><div class="setting-group"><div class="setting-heading">${t('transparency')}</div>${option('glass','true',t('glassOn'),state.glass)}${option('glass','false',t('glassOff'),!state.glass)}</div><div class="setting-group"><div class="setting-heading">${t('about')}</div><button class="setting-option" type="button" data-action="terms"><span>${t('terms')}</span><span aria-hidden="true">›</span></button><div class="setting-option" aria-label="${escapeHTML(t('localNote'))}"><span>${t('localNote')}<small>${t('storageNote')}</small></span></div></div></section>`}
    function termsMarkup(){return `<button class="back-button" type="button" data-action="back">‹ &nbsp;${t('termsBack')}</button><article class="terms-card"><h2>${t('termsIntro')}</h2><p>${t('termsRights')}</p><h2>${t('about')}</h2><p>${t('termsPrivacy')}</p><p>${t('termsPlayback')}</p></article>`}
    function emptyMarkup(){const isFav=state.tab==='favorites';const isMusic=state.tab==='music';const title=isFav?t('emptyFav'):isMusic?t('emptyMusic'):t('emptyVideo');const hint=isFav?t('emptyFavHint'):t('emptyHint');return `<div class="empty"><div class="empty-symbol" aria-hidden="true">${isMusic?'♫':state.tab==='video'?'▷':'♡'}</div><h2>${title}</h2><p>${hint}</p><button class="inline-add" type="button" data-action="add">${t('choose')}</button></div>`}
    function render(){if(!db)return;const title=titleForTab();byId('pageTitle').textContent=title;byId('titleRow').hidden=state.subpage==='terms'||state.playerScreen;document.querySelector('.topbar').hidden=state.playerScreen;document.querySelector('.nav').hidden=state.playerScreen;byId('miniPlayer').hidden=state.playerScreen||!state.current;document.body.classList.toggle('player-open',state.playerScreen);const navTab=state.tab;document.querySelectorAll('.nav button').forEach(b=>b.setAttribute('aria-current',b.dataset.tab===navTab?'page':'false'));byId('mediaCount').textContent=state.tab==='favorites'?`${state.items.filter(x=>x.favorite).length} · ${state.lang==='ar'?'ملف':'items'}`:'';byId('pageSubtitle').textContent=state.tab==='favorites'?t('favCount',{n:state.items.filter(x=>x.favorite).length}):state.tab==='music'?t('fileCount',{n:state.items.filter(x=>x.kind==='audio').length}):state.tab==='video'?t('fileCount',{n:state.items.filter(x=>x.kind==='video').length}):'';const content=byId('content');if(state.playerScreen&&state.current){content.innerHTML=playerScreenMarkup();const video=byId('videoPlayer');if(video){video.playbackRate=[0.5,0.75,1,1.25,1.5,2][state.speedIndex];video.addEventListener('timeupdate',syncProgress);video.addEventListener('loadedmetadata',syncProgress);video.addEventListener('durationchange',syncProgress);video.addEventListener('play',syncPlayButton);video.addEventListener('pause',syncPlayButton);video.addEventListener('ended',()=>stepTrack(1));video.addEventListener('error',()=>showToast(t('unsupported'),true))}syncProgress();syncPlayButton();return}if(state.subpage==='terms'){content.innerHTML=termsMarkup();return}if(state.tab==='settings'){content.innerHTML=settingsMarkup();return}const view=itemsForView();const hasAny=state.items.some(x=>state.tab==='music'?x.kind==='audio':state.tab==='video'?x.kind==='video':x.favorite);let playlistHTML=state.tab==='music'?playlistPanelMarkup():'';let searchHTML=hasAny?`<div class="search-wrap"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true"><circle cx="11" cy="11" r="7" stroke="currentColor" stroke-width="1.8"/><path d="m16.5 16.5 4 4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg><input class="search" id="searchInput" type="search" placeholder="${escapeHTML(t('search'))}" value="${escapeHTML(state.search)}" aria-label="${escapeHTML(t('search'))}"></div>`:'';let preview='';if(state.current?.kind==='video'&&state.currentUrl){preview=`<div class="video-preview"><video id="videoPlayer" playsinline controls preload="metadata" src="${state.currentUrl}"></video><div class="video-label">${escapeHTML(state.current.name)}</div></div>`}content.innerHTML=playlistHTML+searchHTML+preview+(view.length?`<div class="media-list">${view.map(rowMarkup).join('')}</div>`:state.tab==='music'&&state.activePlaylistId?`<div class="empty"><h2>${t('emptyPlaylist')}</h2></div>`:hasAny?`<div class="empty"><h2>${t('noResults')}</h2></div>`:emptyMarkup());const s=byId('searchInput');if(s)s.addEventListener('input',e=>{const pos=e.target.selectionStart;state.search=e.target.value;render();const next=byId('searchInput');next?.focus();next?.setSelectionRange(pos,pos)});const vid=byId('videoPlayer');if(vid){vid.addEventListener('error',()=>showToast(t('unsupported'),true));vid.addEventListener('play',syncPlayButton);vid.addEventListener('pause',syncPlayButton)}}
    function syncPlayer(){const box=byId('miniPlayer');if(!state.current){box.hidden=true;return}box.hidden=state.playerScreen;byId('playerTitle').textContent=state.current.name;byId('playerTitle').title=state.current.name;byId('playerTypeIcon').innerHTML=state.current.kind==='audio'?'<svg width="25" height="25" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 3v12.2a4 4 0 1 1-2-3.5V6l10-2v9.2a4 4 0 1 1-2-3.5V2z"/></svg>':'<svg width="25" height="25" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M4 6.5A2.5 2.5 0 0 1 6.5 4h8A2.5 2.5 0 0 1 17 6.5V8l4-2v12l-4-2v1.5a2.5 2.5 0 0 1-2.5 2.5h-8A2.5 2.5 0 0 1 4 17.5z"/></svg>';syncPlayButton()}
    function syncPlayButton(){const video=byId('videoPlayer');const playing=state.current?.kind==='video'?Boolean(video&&!video.paused):!audio.paused;const label=playing?t('pause'):t('play');const markup=playing?'<path d="M7 5h4v14H7zM14 5h4v14h-4z"/>':'<path d="M8 5v14l11-7z"/>';const miniButton=byId('playButton');if(miniButton){miniButton.setAttribute('aria-label',label);miniButton.title=label}const miniIcon=byId('playIcon');if(miniIcon)miniIcon.innerHTML=markup;const screenButton=byId('screenPlayButton');if(screenButton){screenButton.setAttribute('aria-label',label);screenButton.title=label}const screenIcon=byId('screenPlayIcon');if(screenIcon)screenIcon.innerHTML=markup}
    async function selectItem(item,openScreen=state.playerScreen){const previousUrl=state.currentUrl;const token=++mediaLoadId;audio.pause();const oldVideo=byId('videoPlayer');if(oldVideo)oldVideo.pause();audio.removeAttribute('src');audio.load();state.current=item;state.playerScreen=openScreen;state.currentUrl='';syncPlayer();try{const rec=await tx('files','readonly',s=>s.get(item.id));if(token!==mediaLoadId)return;if(!rec?.blob){showToast(t('unsupported'),true);return}const url=URL.createObjectURL(rec.blob);if(token!==mediaLoadId){URL.revokeObjectURL(url);return}if(previousUrl)URL.revokeObjectURL(previousUrl);state.currentUrl=url;if(item.kind==='audio'){audio.src=url;audio.playbackRate=[0.5,0.75,1,1.25,1.5,2][state.speedIndex];audio.load()}render();syncPlayer()}catch{if(token===mediaLoadId)showToast(t('unsupported'),true)}}
    async function togglePlayback(){if(!state.current){const list=itemsForView();if(list[0])await selectItem(list[0],true);return}try{if(state.current.kind==='audio'){if(audio.paused)await audio.play();else audio.pause()}else{let video=byId('videoPlayer');if(!video){await selectItem(state.current,true);video=byId('videoPlayer')}if(video){if(video.paused)await video.play();else video.pause()}}}catch{showToast(t('unsupported'),true)}syncPlayButton()}
    async function stepTrack(step){const kind=state.current?.kind;const list=itemsForView().filter(x=>!kind||x.kind===kind);if(!list.length)return;let next;if(state.shuffle&&list.length>1){const choices=list.filter(x=>x.id!==state.current?.id);next=choices[Math.floor(Math.random()*choices.length)]}else{let index=list.findIndex(x=>x.id===state.current?.id);if(index<0)index=step>0?-1:0;next=list[(index+step+list.length)%list.length]}await selectItem(next,state.playerScreen);const media=next.kind==='audio'?audio:byId('videoPlayer');if(media){try{await media.play()}catch{}}}
    async function toggleFavorite(id){const item=state.items.find(x=>x.id===id);if(!item)return;item.favorite=!item.favorite;await tx('library','readwrite',s=>s.put(item));if(state.playerScreen){const button=document.querySelector('[data-player-action="favorite"]');if(button){const label=t(item.favorite?'unfavorite':'favorite');button.classList.toggle('active',item.favorite);button.setAttribute('aria-label',label);button.title=label;const icon=button.querySelector('svg');if(icon)icon.setAttribute('fill',item.favorite?'currentColor':'none')}return}await refresh()}
    async function deleteItem(id){const item=state.items.find(x=>x.id===id);if(!item||!confirm(t('removeConfirm')))return;if(state.current?.id===id){audio.pause();audio.removeAttribute('src');audio.load();if(state.currentUrl)URL.revokeObjectURL(state.currentUrl);state.current=null;state.currentUrl='';syncPlayer()}for(const playlist of state.playlists){if((playlist.trackIds||[]).includes(id)){playlist.trackIds=playlist.trackIds.filter(trackId=>trackId!==id);await tx('playlists','readwrite',s=>s.put(playlist))}}await tx('files','readwrite',s=>s.delete(id));await tx('library','readwrite',s=>s.delete(id));await refresh()}
    function detectKind(file){if(file.type.startsWith('audio/'))return'audio';if(file.type.startsWith('video/'))return'video';const ext=file.name.split('.').pop()?.toLowerCase()||'';const audioExt=['mp3','m4a','aac','wav','aiff','aif','ogg','oga','flac','alac','wma','amr','opus','caf','mid','midi'];const videoExt=['mp4','m4v','mov','webm','ogv','avi','mkv','3gp','mpeg','mpg','ts','m2ts'];return audioExt.includes(ext)?'audio':videoExt.includes(ext)?'video':null}
    async function importFiles(files){if(!files.length)return;let added=0,failed=0;state.busy=true;for(const file of files){const kind=detectKind(file);if(!kind)continue;const id=crypto.randomUUID();const entry={id,name:file.name,size:file.size,type:file.type||'',kind,favorite:false,addedAt:Date.now()+added};try{await new Promise((resolve,reject)=>{const tr=db.transaction(['library','files'],'readwrite');tr.objectStore('library').put(entry);tr.objectStore('files').put({id,blob:file});tr.oncomplete=resolve;tr.onerror=()=>reject(tr.error);tr.onabort=()=>reject(tr.error||new Error('Storage full'))});added++}catch{failed++;break}}state.busy=false;await refresh();if(added)showToast(t('imported'));if(failed)showToast(t('importFailed'),true);if(!added&&!failed)showToast(t('noMedia'),true);byId('fileInput').value=''}
    function setTab(tab){state.tab=tab;state.subpage='';state.search='';render();window.scrollTo({top:0,behavior:'smooth'})}
    document.addEventListener('click',async e=>{const target=e.target.closest('button,[role="button"]');if(!target)return;if(target.id==='addButton'||target.dataset.action==='add'){byId('fileInput').click();return}if(target.dataset.tab){setTab(target.dataset.tab);return}if(target.dataset.action==='terms'){state.subpage='terms';render();return}if(target.dataset.action==='back'){state.subpage='';render();return}if(target.dataset.setting){const {setting,value}=target.dataset;if(setting==='lang')state.lang=value;if(setting==='theme')state.theme=value;if(setting==='glass')state.glass=value==='true';savePrefs();applyPrefs();return}if(target.dataset.playerAction){const action=target.dataset.playerAction;if(action==='back'){if(state.current?.kind==='video')byId('videoPlayer')?.pause();state.playerScreen=false;render();syncPlayer();return}if(action==='favorite'){if(state.current)await toggleFavorite(state.current.id);return}if(action==='toggle'){await togglePlayback();return}if(action==='next'){await stepTrack(1);return}if(action==='previous'){await stepTrack(-1);return}if(action==='back10'||action==='forward10'){const media=activeMedia();if(media&&Number.isFinite(media.duration)){media.currentTime=Math.max(0,Math.min(media.duration,media.currentTime+(action==='back10'?-10:10)));syncProgress()}return}if(action==='shuffle'){state.shuffle=!state.shuffle;const button=byId('shuffleButton');if(button){button.setAttribute('aria-pressed',String(state.shuffle));const label=t(state.shuffle?'shuffleOn':'shuffle');button.setAttribute('aria-label',label);button.title=label}return}if(action==='speed'){const speeds=[0.5,0.75,1,1.25,1.5,2];state.speedIndex=(state.speedIndex+1)%speeds.length;const rate=speeds[state.speedIndex];audio.playbackRate=rate;const video=byId('videoPlayer');if(video)video.playbackRate=rate;const value=rate.toFixed(2).replace(/0+$/,'').replace(/\.$/,'.0');const label=t('speedValue',{value});const button=byId('speedButton');if(button){button.textContent=label;button.setAttribute('aria-label',label);button.title=label}return}}if(target.dataset.closeDialog){byId(target.dataset.closeDialog).close();return}if(target.dataset.action==='create-playlist'){state.pendingTrackAfterCreate=null;openCreatePlaylist();return}if(target.dataset.playlistFilter!==undefined){state.activePlaylistId=target.dataset.playlistFilter||null;state.search='';render();return}if(target.classList.contains('playlist-item')){if(!state.playlists.length){state.pendingTrackAfterCreate=target.dataset.id;openCreatePlaylist()}else openPlaylistDialog(target.dataset.id);return}if(target.classList.contains('remove-from-playlist')){await removeFromActivePlaylist(target.dataset.id);return}if(target.classList.contains('delete-playlist')){await deletePlaylist(target.dataset.id);return}if(target.classList.contains('play-item')){const item=state.items.find(x=>x.id===target.dataset.id);if(item)await selectItem(item,true);return}if(target.classList.contains('favorite-item')){await toggleFavorite(target.dataset.id);return}if(target.classList.contains('remove-item')){await deleteItem(target.dataset.id);return}});
    document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.matches('.play-item[role="button"]'))e.target.click()});document.addEventListener('input',e=>{if(e.target.id==='seekRange'){const media=activeMedia();if(media){media.currentTime=Number(e.target.value);syncProgress()}}});
    byId('fileInput').addEventListener('change',e=>importFiles([...e.target.files]));byId('createPlaylistForm').addEventListener('submit',createPlaylistFromForm);byId('createPlaylistDialog').addEventListener('close',()=>{state.pendingTrackAfterCreate=null});byId('playlistMembershipForm').addEventListener('submit',savePlaylistMembership);byId('playlistMembershipDialog').addEventListener('close',()=>{state.playlistDialogMediaId=null});byId('playButton').addEventListener('click',togglePlayback);byId('nextButton').addEventListener('click',()=>stepTrack(1));byId('previousButton').addEventListener('click',()=>stepTrack(-1));audio.addEventListener('play',syncPlayButton);audio.addEventListener('pause',syncPlayButton);audio.addEventListener('timeupdate',syncProgress);audio.addEventListener('loadedmetadata',syncProgress);audio.addEventListener('durationchange',syncProgress);audio.addEventListener('ended',()=>stepTrack(1));audio.addEventListener('error',()=>{if(state.current?.kind==='audio')showToast(t('unsupported'),true)});matchMedia('(prefers-color-scheme: light)').addEventListener?.('change',()=>{if(state.theme==='system')applyPrefs()});
    readPrefs();applyPrefs();openDB().then(async d=>{db=d;await refresh();applyPrefs();if('serviceWorker'in navigator&&location.protocol!=='file:')navigator.serviceWorker.register('./sw.js').catch(()=>{})}).catch(()=>{byId('content').innerHTML=`<div class="notice error">${escapeHTML(state.lang==='ar'?'تعذر فتح المكتبة المحلية في هذا المتصفح. افتح الموقع عبر HTTPS ثم أعد المحاولة.':'Could not open local storage. Open the website over HTTPS and try again.')}</div>`});
